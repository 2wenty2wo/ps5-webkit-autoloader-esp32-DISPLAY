name: Build S3 LCD firmware
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install deps
        run: |
          sed -i 's/\r$//' *.sh Makefile
          chmod +x *.sh
          ./install-deps.sh
      - name: Build mklittlefs if needed
        run: |
          if [ ! -x mklittlefs/mklittlefs ]; then
            make -C mklittlefs -j"$(nproc)"
          fi
      - name: Build
        run: make s3-lcd LCD_TEST=1
      - uses: actions/upload-artifact@v4
        with:
          name: s3-lcd-firmware
          path: build/lcd/s3/esp32-arduino.s3.merged.bin
